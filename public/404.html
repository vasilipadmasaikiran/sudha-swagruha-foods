<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sudha Swagruha Foods</title>
    <script>
      // GitHub Pages SPA Fallback
      // Saves the current URL and redirects to index.html so React Router can handle it.
      sessionStorage.setItem('spa-redirect', window.location.href);
      window.location.replace(window.location.origin + window.location.pathname.split('/').slice(0, 2).join('/'));
    </script>
  </head>
  <body></body>
</html>
